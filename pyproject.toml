[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flamelens"
version = "0.1.0"
description = "Summarize, rank and interpret NASA microgravity combustion experiments for spacecraft fire safety."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "scikit-learn>=1.5",
    "shap>=0.45",
    "mapie>=1.0",
    "joblib>=1.3",
    "pymupdf>=1.24",
    "scipy>=1.11",
    "pydantic>=2",
    "rapidfuzz>=3",
    "rank_bm25>=0.2",
    "sentence-transformers>=3",
    "faiss-cpu>=1.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
llm = ["anthropic>=1.0"]
review = ["streamlit>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flamelens = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: trains models; deselect with -m 'not slow'"]
